<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background / Aura Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Main Gradients -->
    <linearGradient id="cartonBody" x1="14" y1="20" x2="50" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cartonBorder" x1="14" y1="8" x2="50" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="roofGrad" x1="14" y1="12" x2="50" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <linearGradient id="roofRidge" x1="22" y1="6" x2="42" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="milkFill" x1="14" y1="38" x2="50" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="codeGrad" x1="20" y1="36" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <linearGradient id="sparkleGrad" x1="42" y1="4" x2="56" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="goldSparkle" x1="4" y1="40" x2="16" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Carton -->
  <path d="M22 8 L42 8 L50 22 L50 53 C50 56.5 47.5 59 44 59 L20 59 C16.5 59 14 56.5 14 53 L14 22 Z"
        fill="#818cf8" opacity="0.25" filter="url(#glow)" />

  <!-- Outer Carton Body -->
  <path d="M22 13 L42 13 L50 23 L50 53 C50 56.8 47.2 59.5 43.5 59.5 L20.5 59.5 C16.8 59.5 14 56.8 14 53 L14 23 Z"
        fill="url(#cartonBody)" stroke="url(#cartonBorder)" stroke-width="2" stroke-linejoin="round" />

  <!-- Roof Slopes & Gable Fold -->
  <path d="M22 13 L42 13 L50 23 L14 23 Z" fill="url(#roofGrad)" />
  <path d="M32 13 L32 23" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
  <path d="M22 13 L32 23 L42 13" stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.5" fill="none" />

  <!-- Top Pinch Ridge / Seal Clip -->
  <rect x="23" y="6.5" width="18" height="6.5" rx="2" fill="url(#roofRidge)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6" />
  <!-- Seal texture notches -->
  <line x1="27" y1="7.5" x2="27" y2="12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" />
  <line x1="32" y1="7.5" x2="32" y2="12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" />
  <line x1="37" y1="7.5" x2="37" y2="12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" />

  <!-- Milk / Energy Wave Layer inside carton -->
  <path d="M15 38 Q24 33 32 37 T49 35 L49 53 C49 56.2 46.8 58.5 43.5 58.5 L20.5 58.5 C17.2 58.5 15 56.2 15 53 Z"
        fill="url(#milkFill)" opacity="0.85" />
  
  <!-- Subtle Wave Highlight Line -->
  <path d="M15 38 Q24 33 32 37 T49 35"
        fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Code Symbols </> inside the carton -->
  <!-- Left Bracket < -->
  <path d="M25 41.5 L20.5 45.5 L25 49.5"
        stroke="url(#codeGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket > -->
  <path d="M39 41.5 L43.5 45.5 L39 49.5"
        stroke="url(#codeGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Slash / -->
  <path d="M34 40 L30 51"
        stroke="url(#codeGrad)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Floating Sparkle ✦ Top-Right -->
  <path d="M49 4 C49 8.2 52.2 11 56 11 C52.2 11 49 13.8 49 18 C49 13.8 45.8 11 42 11 C45.8 11 49 8.2 49 4 Z"
        fill="url(#sparkleGrad)" filter="url(#glow)" />

  <!-- Small Cute Mini Star Bottom-Left -->
  <path d="M10 43 C10 45.5 12 47 14 47 C12 47 10 48.5 10 51 C10 48.5 8 47 6 47 C8 47 10 45.5 10 43 Z"
        fill="url(#goldSparkle)" />

  <!-- Tiny sparkle dot -->
  <circle cx="56" cy="24" r="1.5" fill="#38bdf8" opacity="0.9" />
</svg>